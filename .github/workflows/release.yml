name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance / trusted publishing
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      # Publishing uses npm Trusted Publishing (OIDC) — no repository secret required.
      # Requires the workflow permission above (id-token: write) plus the
      # "Trusted Publisher" configured on npmjs.com for this repo + workflow file.
      #
      # Token fallback (needs repo Admin rights to add the secret):
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --provenance --access public

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance and Trusted Publishing (OIDC)
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # No `registry-url` here: with Trusted Publishing there is no token to write into
          # .npmrc, and omitting it also drops setup-node's deprecated `always-auth` entry
          # (source of the "Unknown user config \"always-auth\"" warning). The default registry
          # is https://registry.npmjs.org/ already.
          node-version: 24

      # npm Trusted Publishing requires npm >= 11.5.1 (OIDC token exchange did not exist
      # before 11.5). Node 24.0 shipped npm 11.3, so pin explicitly rather than trusting
      # whatever the runner image provides.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          node --version
          npm --version

      - run: npm ci
      - run: npm run build

      # A release tag does not change what gets published: npm publishes the version found in
      # package.json at the commit the tag points to. Guard against the two classic mistakes —
      # tag bumped but version not, or re-tagging an already published version.
      - name: Check release version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "package.json: $PKG_VERSION   release tag: ${{ github.ref_name }}"
          if [ "v$PKG_VERSION" != "${{ github.ref_name }}" ]; then
            echo "::error::Version mismatch — tag is ${{ github.ref_name }} but package.json says $PKG_VERSION."
            echo "::error::Bump the version (npm version patch --no-git-tag-version), commit it, and tag that commit."
            exit 1
          fi
          if npm view "n8n-nodes-atria@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::error::n8n-nodes-atria@$PKG_VERSION is already published. Bump the version instead of re-tagging."
            exit 1
          fi

      # Authentication is npm Trusted Publishing: npm exchanges the GitHub Actions OIDC
      # id-token for a short-lived publish token, so no NPM_TOKEN secret and no OTP prompt
      # (granular tokens that bypass 2FA are being retired for direct publishing).
      #
      # One-time setup on npmjs.com -> package n8n-nodes-atria -> Settings -> Trusted Publisher:
      #   Provider: GitHub Actions
      #   Owner/organization: Pulsy-Global
      #   Repository name:    n8n-nodes-atria
      #   Workflow name:      release.yml     <- file name, must match exactly
      #   Environment name:   <empty>
      - name: Publish
        run: npm publish --provenance --access public

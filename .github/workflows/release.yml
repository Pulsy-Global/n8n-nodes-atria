name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance / trusted publishing
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm >= 11.5.1, which is required both for --provenance and
      # for npm Trusted Publishing (OIDC), so the token path can be swapped later
      # without changing the runner setup.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      # A release tag does not change what gets published: npm publishes the version found in
      # package.json at the commit the tag points to. Guard against the two classic mistakes —
      # tag bumped but version not, or re-tagging an already published version.
      - name: Check release version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "package.json: $PKG_VERSION   release tag: ${{ github.ref_name }}"
          if [ "v$PKG_VERSION" != "${{ github.ref_name }}" ]; then
            echo "::error::Version mismatch — tag is ${{ github.ref_name }} but package.json says $PKG_VERSION."
            echo "::error::Bump the version (npm version patch --no-git-tag-version), commit it, and tag that commit."
            exit 1
          fi
          if npm view "n8n-nodes-atria@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::error::n8n-nodes-atria@$PKG_VERSION is already published. Bump the version instead of re-tagging."
            exit 1
          fi

      # actions/setup-node writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # and, when the secret is absent, substitutes the literal placeholder
      # `XXXXX-XXXXX-XXXXX-XXXXX`. npm then publishes *anonymously*, and the registry
      # answers with the misleading `404 Not Found - PUT https://registry.npmjs.org/<pkg>`.
      # Fail here instead, with a readable message.
      - name: Check npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node --version
          npm --version
          if [ -z "${NODE_AUTH_TOKEN:-}" ] || [ "${NODE_AUTH_TOKEN}" = "XXXXX-XXXXX-XXXXX-XXXXX" ]; then
            echo "::error::NPM_TOKEN is not reaching the workflow. Add it as a *repository* secret"
            echo "::error::(Settings -> Secrets and variables -> Actions -> New repository secret),"
            echo "::error::named exactly NPM_TOKEN. An environment secret, or an org secret that does"
            echo "::error::not include this repository, will not be visible here."
            exit 1
          fi
          npm whoami

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      # Secret-free alternative (no NPM_TOKEN at all): configure the package on
      # npmjs.com -> Settings -> Trusted Publisher -> GitHub Actions with
      # owner Pulsy-Global, repository n8n-nodes-atria, workflow file release.yml,
      # then delete the two `env:` blocks above. Requires npm >= 11.5.1 (Node 24).
